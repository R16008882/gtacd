name: Basic CI workflow
on:
  push:
    branches:
      - main
env:
  CUSTOM_MESSAGE: "Execution du workflow GTACD"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make script executable
      run: chmod +x ./app/check_app.sh

    - name: Run application check script
      run: ./app/check_app.sh

    - name: Display index.html content
      run: cat ./app/index.html

    - name: Display variables and secrets
      env:
        FAKE_API_TOKEN: ${{ secrets.FAKE_API_TOKEN }}
        ENV_TYPE: ${{ secrets.ENV_TYPE }}
      run: |
       echo "Message personnalisé : $CUSTOM_MESSAGE"
       echo "Runner OS : $RUNNER_OS"
       echo "ENV_TYPE : $ENV_TYPE"
       echo "FAKE_API_TOKEN : $FAKE_API_TOKEN"